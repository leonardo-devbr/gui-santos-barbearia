name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: gui_santos_barbearia_ci
          MYSQL_USER: barbearia_ci
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: barbearia_ci
      MYSQL_PASSWORD: ci-app-password
      MYSQL_DATABASE: gui_santos_barbearia_ci
      MYSQL_SSL: "false"
      MYSQL_SETUP_USER: root
      MYSQL_SETUP_PASSWORD: ci-root-password
      APP_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create local environment placeholder
        run: touch .env.local

      - name: Prepare MySQL schema
        run: npm run db:setup

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Build application
        run: npm run build
